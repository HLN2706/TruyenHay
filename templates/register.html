{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Đăng ký</h1>
    <p class="sub">Tạo tài khoản để lưu truyện, đánh giá và bình luận</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('register') }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required></div>
      <div class="field"><label for="email">Email</label>
        <input type="text" id="email" name="email" required></div>
      <div class="field"><label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Tạo tài khoản</button>
    </form>
    <div class="auth-foot">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></div>
  </div>
</div>
{% endblock %}
