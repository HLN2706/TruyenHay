{% extends "base.html" %}
{% block title %}Lỗi {{ code }}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p><a class="btn btn-primary" href="{{ url_for('index') }}">Về trang chủ</a></p>
  {% if detail %}<pre>{{ detail }}</pre>{% endif %}
</div>
{% endblock %}
